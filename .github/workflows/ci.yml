name: CI

on:
  push:
    branches: [main]
  pull_request:

# A green pipeline is a precondition for merge: lint, then tests against real
# Postgres and Redis, then the image build.
permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify generated code is current
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
          sqlc generate
          git diff --exit-code -- internal/store || {
            echo "::error::sqlc output is stale; run 'sqlc generate' and commit the result"
            exit 1
          }

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Docker is available on the runner, so testcontainers starts the real
      # Postgres 17 and Redis the integration suite needs. The variable turns a
      # missing daemon into a failure instead of a silent skip.
      - name: Run tests
        env:
          ZAPPERMEOW_REQUIRE_DOCKER: "1"
        run: go test ./... -race -count=1 -timeout 20m

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build multi-stage image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: zappermeow:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
