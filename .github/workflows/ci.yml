name: CI

on:
  push:
    branches: [main]
  pull_request:

# A green pipeline is a precondition for merge: lint, then tests against real
# Postgres and Redis, then the image build.
permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # O sqlc vem como binário da release em vez de `go install`: a partir da
      # v1.31.1 ele exige Go 1.26 para compilar, acima do toolchain do projeto.
      # A versão é fixa porque um upgrade silencioso poderia mudar a saída
      # gerada e reprovar esta verificação sem nenhuma mudança no repositório.
      - name: Verify generated code is current
        env:
          SQLC_VERSION: "1.31.1"
        run: |
          mkdir -p "$RUNNER_TEMP/sqlc"
          curl -fsSL "https://github.com/sqlc-dev/sqlc/releases/download/v${SQLC_VERSION}/sqlc_${SQLC_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/sqlc" sqlc
          "$RUNNER_TEMP/sqlc/sqlc" generate
          git diff --exit-code -- internal/store || {
            echo "::error::sqlc output is stale; run 'sqlc generate' and commit the result"
            exit 1
          }

      # v9 do action instala o golangci-lint v2 (formato do .golangci.yml daqui).
      # A versão é fixada porque o binário precisa ser compilado com Go >= 1.25
      # para analisar um módulo que declara `go 1.25.0`.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Docker is available on the runner, so testcontainers starts the real
      # Postgres 17 and Redis the integration suite needs. The variable turns a
      # missing daemon into a failure instead of a silent skip.
      - name: Run tests
        env:
          ZAPPERMEOW_REQUIRE_DOCKER: "1"
        run: go test ./... -race -count=1 -timeout 20m

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build multi-stage image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: zappermeow:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
