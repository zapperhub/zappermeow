# ZapperMeow on a single host.
#
# Same image and same services as the Swarm target; what differs is only what
# has to: no placement constraints, named local volumes, a bridge network. Any
# change to the service topology belongs in stack.yml as well — the constitution
# requires functional parity between the two targets.
#
#   docker compose up -d
#
# Secrets come from files under ./secrets, mounted at /run/secrets, exactly as
# Swarm does it; env vars stay a development fallback.

name: zappermeow

x-app-env: &app-env
  ZAPPERMEOW_REDIS_ADDR: redis:6379
  ZAPPERMEOW_LOG_LEVEL: info
  # Secrets are read from /run/secrets and win over the environment.
  ZAPPERMEOW_SECRETS_DIR: /run/secrets

services:
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/acme
    networks: [edge, internal]

  api:
    image: zappermeow:latest
    command: ["serve"]
    restart: unless-stopped
    environment:
      <<: *app-env
      ZAPPERMEOW_LISTEN_ADDR: ":8080"
    secrets: [database_url, redis_password, jwt_signing_key, bootstrap_email, bootstrap_password]
    depends_on: [postgres, redis]
    networks: [edge, internal]
    labels:
      traefik.enable: "true"
      traefik.http.routers.api.rule: Host(`${ZAPPERMEOW_HOST:-localhost}`)
      traefik.http.routers.api.entrypoints: websecure
      traefik.http.services.api.loadbalancer.server.port: "8080"
      # Sticky sessions matter only for the WebSocket: every other route is
      # stateless and any replica may answer it.
      traefik.http.services.api.loadbalancer.sticky.cookie: "true"
      traefik.http.services.api.loadbalancer.sticky.cookie.name: zappermeow_ws

  session-worker:
    image: zappermeow:latest
    command: ["session-worker"]
    restart: unless-stopped
    environment:
      <<: *app-env
      ZAPPERMEOW_WORKER_GRPC_LISTEN_ADDR: ":9090"
      # Left unset on purpose: the worker advertises its container hostname,
      # which is what the API dials. A load-balanced name here would send
      # commands to a process that does not own the session.
      ZAPPERMEOW_MAX_SESSIONS_PER_WORKER: "200"
    secrets: [database_url, redis_password]
    depends_on: [postgres, redis]
    networks: [internal]
    # Draining hands the leases back so another worker adopts in seconds. Kill
    # the process before it finishes and every session waits out the lease
    # expiry instead.
    stop_grace_period: 60s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zappermeow
      POSTGRES_USER: zappermeow
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zappermeow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF on: the queues and the event sequence live here, and losing them
    # silently would be worse than a slower write path.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  traefik-acme:

networks:
  # Public traffic terminates on the edge network; everything internal —
  # gRPC, Postgres, Redis — stays on a private bridge.
  edge:
  internal:
    internal: true

secrets:
  database_url:
    file: ./secrets/database_url
  redis_password:
    file: ./secrets/redis_password
  jwt_signing_key:
    file: ./secrets/jwt_signing_key
  bootstrap_email:
    file: ./secrets/bootstrap_email
  bootstrap_password:
    file: ./secrets/bootstrap_password
  postgres_password:
    file: ./secrets/postgres_password
